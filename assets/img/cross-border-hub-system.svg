<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">China–ASEAN–global: the complete connecting product</title>
  <desc id="desc">Two illustrative China origins feed an ASEAN home hub, with onward connections to two illustrative global markets. Traffic rights, transfer delivery, and net contribution must support the journey. This is a conceptual network, not a map or an existing schedule.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#41877f"/></marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="49" font-size="27" font-weight="700" fill="#173454">China–ASEAN–global</text>
    <text x="36" y="80" font-size="18" fill="#52677c">A connecting product needs more than geographic proximity.</text>
    <g fill="none" stroke="#41877f" stroke-width="3" marker-end="url(#arrow)">
      <path d="M252 178C302 178 301 232 349 232"/>
      <path d="M252 303C302 303 301 259 349 259"/>
      <path d="M611 232C661 232 659 178 707 178"/>
      <path d="M611 259C661 259 659 303 707 303"/>
    </g>
    <g fill="#ffffff" stroke="#ced9e5" stroke-width="1.5">
      <rect x="36" y="134" width="216" height="88" rx="12"/>
      <rect x="36" y="259" width="216" height="88" rx="12"/>
      <rect x="708" y="134" width="216" height="88" rx="12"/>
      <rect x="708" y="259" width="216" height="88" rx="12"/>
    </g>
    <g text-anchor="middle" fill="#173454" font-size="22" font-weight="700">
      <text x="144" y="173">China origin A</text><text x="144" y="298">China origin B</text>
      <text x="816" y="173">Global market C</text><text x="816" y="298">Global market D</text>
    </g>
    <g text-anchor="middle" fill="#52677c" font-size="17">
      <text x="144" y="201">Demand + feeder seats</text><text x="144" y="326">Demand + feeder seats</text>
      <text x="816" y="201">Own or partner service</text><text x="816" y="326">Own or partner service</text>
    </g>
    <rect x="350" y="151" width="260" height="188" rx="15" fill="#173454"/>
    <g text-anchor="middle" fill="#ffffff">
      <text x="480" y="196" font-size="27" font-weight="700">ASEAN home hub</text>
      <text x="480" y="230" font-size="19">Credible banks both ways</text>
      <text x="480" y="260" font-size="19">Tickets + bags + transfer</text>
      <text x="480" y="290" font-size="19">Disruption recovery</text>
      <text x="480" y="317" font-size="16" fill="#bed7e5">Home-carrier model illustrated</text>
    </g>
    <path d="M36 384H924" stroke="#ced9e5"/>
    <g font-size="19" text-anchor="middle">
      <text x="175" y="422" fill="#173454" font-weight="700">01  Rights confirmed</text>
      <text x="480" y="422" fill="#173454" font-weight="700">02  Journey deliverable</text>
      <text x="785" y="422" fill="#173454" font-weight="700">03  Contribution tested</text>
      <text x="175" y="450" fill="#52677c" font-size="17">Each sector and traffic flow</text>
      <text x="480" y="450" fill="#52677c" font-size="17">Normal and disrupted travel</text>
      <text x="785" y="450" fill="#52677c" font-size="17">After cost and displacement</text>
    </g>
    <text x="36" y="507" fill="#52677c" font-size="16">Conceptual only. Arrows do not assert existing services or approved traffic rights.</text>
  </g>
</svg>
